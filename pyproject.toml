[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=8.0",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "pyologger"
description = "Tools for analyzing biologging data in Python."
requires-python = ">=3.8" # specifying minimum and maximum python versions
version = "0.1.0"
authors = [
  { name = "Jessica Kendall-Bar", email = "jkendallbar@ucsd.edu" },
]
dependencies = [
  "numpy",
  "pandas",
  "mne",
  "pytz",
  "wfdb",
  "sleepecg",
  "altair",
  "python-dotenv",
  "notion-client",
  "scikit-learn",
  "pycatch22",
  "streamlit",
  "lightgbm",
  "plotly",
  "nbformat",
  "ipywidgets",
  "anywidget",
  "snakemake",
  "plotly-resampler",
  "dash",
  "dash-cytoscape",
  "streamlit-plotly-events",
  "magnetic_field_calculator",
  "pelicanfs",
  "s3fs",
  # Pinned to an exact commit (tip of organism-rename / PR #53). main still has the
  # pre-rename data_uploader requiring metadata["animal"], which fails organism-keyed
  # uploads with KeyError: 'animal'. Unpinned, pip resolves to whatever the default
  # branch holds at install time. Re-pin to a tag once this merges to main.
  "DiveDB @ git+https://github.com/ecophysviz-lab/DiveDB.git@197449138c8c108d862f9a1547e99abb9c195e61",
  "EDFlib-Python",
  "openpyxl",
  "notebook",
  "ipykernel",
  "geoai-py",
  "leafmap",
  "pystac-client",
  "planetary-computer",
  "erddapy",
  "rioxarray",
  "rasterio",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.0",
  "sphinx-rtd-theme>=2.0",
  "antropy",
]

[tool.setuptools.packages.find] # finds submodules
where = [""]
include = ["pyologger*"]
