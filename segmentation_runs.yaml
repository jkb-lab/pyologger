segmentation_event_definitions:
  base:
    algorithmic_segments:
      defaults:
        type: state
        short_description: '{label_name}'
        long_description: Algorithmic segmentation ({variant_id}) [{segment_stage}]
      input_labels:
      - active_uw_swimming
      - calm_uw_gliding
      - resting_surface
      - resting_benthic
      - long_drift
      - active_surface_swimming
      - calm_surface_gliding
      - unscorable
      output_labels:
      - behavior_active_swimming_diving
      - behavior_calm_gliding_diving
      - behavior_motionless_resting_surface
      - behavior_motionless_resting_benthic
      - behavior_motionless_resting_drift
      - behavior_active_swimming_surface
      - behavior_calm_gliding_surface
      - behavior_unscorable
      event_keys:
        find_rest.initial:
          short_description: find_rest.initial
          long_description: Initial algorithmic segment candidate
        find_rest.filtered:
          short_description: find_rest.filtered
          long_description: Context-filtered algorithmic segment
        rest.initial:
          short_description: rest.initial
          long_description: Initial algorithmic segment candidate
        rest.filtered:
          short_description: rest.filtered
          long_description: Context-filtered algorithmic segment
        behavior_motionless_resting_surface:
          short_description: behavior_motionless_resting_surface
          long_description: Algorithmic surface motionless resting segment
        behavior_motionless_resting_benthic:
          short_description: behavior_motionless_resting_benthic
          long_description: Algorithmic benthic motionless resting segment
        behavior_motionless_resting_drift:
          short_description: behavior_motionless_resting_drift
          long_description: Algorithmic drift motionless resting segment
        behavior_active_swimming_diving:
          short_description: Swimming (UW)
          long_description: Algorithmic underwater active swimming segment (stroke_rate above threshold)
        behavior_calm_gliding_diving:
          short_description: Gliding (UW)
          long_description: Algorithmic underwater calm gliding segment (stroke_rate below threshold,
            non-rest)
        behavior_active_swimming_surface:
          short_description: Swimming (Surface)
          long_description: Algorithmic surface active swimming segment (stroke_rate above threshold)
        behavior_calm_gliding_surface:
          short_description: Gliding (Surface)
          long_description: Algorithmic surface calm gliding segment (stroke_rate below threshold, non-rest)
        behavior_unscorable:
          short_description: Unscorable (unclear)
          long_description: Algorithmic segment excluded as unscorable
      variants:
        find_rest:
          defaults:
            long_description: Algorithmic segmentation (find_rest) [{segment_stage}]
        rest:
          defaults:
            long_description: Algorithmic segmentation (rest) [{segment_stage}]
    supervised_predictions:
      defaults:
        type: state
        short_description: supervised_{label_name_normalized}_start
        long_description: 'Supervised prediction state: {label_name}'
      input_labels:
      - 'source: supervised.label_group'
      output_labels:
      - 'target: supervised.event_keys'
      event_keys:
        rf_unknown:
          short_description: supervised_unknown_start
          long_description: 'Supervised prediction state: Unknown/uncertain'
      labels:
        Unknown:
          short_description: supervised_unknown_start
          long_description: 'Supervised prediction state: Unknown/uncertain'
