      random_state: 42
      strict_qc: false
      sampling_compatibility_tolerance: null
      channel_feature_spec:
        heart_rate.heart_rate:
          transforms:
          - raw
          feature_set: full
        stroke_rate.stroke_rate:
          transforms:
          - raw
          feature_set: full
        depth.depth:
          transforms:
          - raw
          feature_set: medium
          required: false
    unsupervised:
      cluster_passes:
      - name: k3
        n_clusters: 3
        channel_feature_spec:
          heart_rate.heart_rate:
            transforms:
            - raw
            feature_set: full
          stroke_rate.stroke_rate:
            transforms:
            - raw
            feature_set: full
      - name: k5
        n_clusters: 5
        channel_feature_spec:
          heart_rate.heart_rate:
            transforms:
            - raw
            feature_set: full
          stroke_rate.stroke_rate:
            transforms:
            - raw
            feature_set: full
          depth.depth:
            transforms:
            - raw
            feature_set: medium
            required: false
      primary_input_channel_for_ranking: heart_rate.heart_rate
      corr_threshold: 0.8
      n_clusters: auto
      max_k: 8
      run_pca: true
      run_tsne: false
      run_umap: true
    supervised:
      enabled: false
      config:
        test_size: 0.4
        rf_n_estimators: 500
        rf_min_samples_leaf: 2
        rf_class_weight: balanced_subsample
        confidence_threshold: 0.4
    summary:
      config:
        primary_method_kind: clustering
        primary_method_id: clustered_windows
        budget_label_mode: canonical
        actograms:
          daily: false
          continuous: false
