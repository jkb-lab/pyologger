context_filter_definitions:
  low_stroke_rate_required:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      segment_family: drift_candidate
    covariate_ref: intrinsic.stroke_rate_rest_gate
    rule:
      mode: threshold_gate
      field: segment_mean_stroke_rate_spm
      keep_if:
        comparator: <
        threshold: 10.0
    on_missing_covariate: reject
    action_on_fail: reject
    reject_reason: stroke_rate_too_high
  drift_within_intrinsic_context:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      segment_family: drift_candidate
    covariate_ref: intrinsic.inferred_buoyancy
    rule:
      mode: threshold_gate
      value_expr: abs(drift_rate_ms - inferred_buoyancy_value)
      keep_if:
        comparator: <
        threshold: 0.3
    on_missing_covariate: reject
    action_on_fail: reject
    reject_reason: intrinsic_context_mismatch
  prepositive_negative_only:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - pre_positive
      - never_positive
    rule:
      mode: category_gate
      field: segment_sign
      allowed_values:
      - negative
    action_on_fail: reject
    reject_reason: prepositive_positive_drift_rejected
  prepositive_negative_long_enough:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - pre_positive
      - never_positive
      segment_sign: negative
    rule:
      mode: threshold_gate
      field: duration_s
      keep_if:
        comparator: '>='
        threshold: 200.0
    action_on_fail: reject
    reject_reason: prepositive_negative_too_short
  prepositive_negative_not_benthic_transit:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - pre_positive
      - never_positive
      segment_sign: negative
    rule:
      mode: threshold_gate
      value_expr: abs(drift_rate_ms)
      keep_if:
        comparator: '>'
        threshold: 0.08
    action_on_fail: reject
    reject_reason: prepositive_negative_too_flat
  postpositive_negative_deep_enough:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - post_positive
      - always_positive
      segment_sign: negative
    rule:
      mode: threshold_gate
      field: start_depth_m
      keep_if:
        comparator: '>='
        threshold: 200.0
    action_on_fail: reject
    reject_reason: postpositive_negative_too_shallow
  postpositive_negative_long_enough:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - post_positive
      - always_positive
      segment_sign: negative
    rule:
      mode: threshold_gate
      field: duration_s
      keep_if:
        comparator: '>='
        threshold: 200.0
    action_on_fail: reject
    reject_reason: postpositive_negative_too_short
  early_trip_refinement:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - pre_positive
      - never_positive
      elapsed_days:
        comparator: <
        threshold: 15.0
    rule:
      mode: threshold_gate
      value_expr: abs(drift_rate_ms - inferred_buoyancy_early_reference_value)
      keep_if:
        comparator: <
        threshold: 0.15
    on_missing_covariate: skip_filter
    action_on_fail: reject
    reject_reason: early_trip_refinement_failed
  late_trip_refinement:
    enabled: true
    target_state_keys:
    - find_rest.long_drift
    applies_when:
      inferred_trip_phase_in:
      - never_positive
    rule:
      mode: threshold_gate
      value_expr: abs(drift_rate_ms - inferred_buoyancy_late_reference_value)
      keep_if:
        comparator: <
        threshold: 0.15
    on_missing_covariate: skip_filter
    action_on_fail: reject
    reject_reason: late_trip_refinement_failed
supervised_context_filter_definitions:
  inferred_buoyancy_must-be-aligned:
    enabled: true
    applies_when:
      predicted_label_pre_context: __positive_label__
    rule:
      mode: threshold_gate
      field: algorithmic_context_keep
      keep_if:
        comparator: ==
        threshold: 1
    on_missing_covariate: reject
    action_on_fail: reject
    reject_reason: rf_sleep_context_rejected
  gliding_must-be-true:
    enabled: true
    applies_when:
      predicted_label_pre_context: __positive_label__
    rule:
      mode: threshold_gate
      field: algorithmic_segment_mean_stroke_rate_spm
      keep_if:
        comparator: <
        threshold: 10.0
    on_missing_covariate: reject
    action_on_fail: reject
    reject_reason: rf_sleep_not_gliding
supervised_label_group_definitions:
  BEHAVIOR_LIONS:
    label_groups:
