        - 2015-07-03_pale-006
        - 2015-07-01_pale-007
        - 2015-07-16_pale-008
        - 2015-10-15_pale-009
        - 2015-06-16_pale-010
        - 2015-11-10_pale-011
        Kenya_F:
        - 2014-11-13_pale-012
        - 2014-10-03_pale-013
        - 2014-09-24_pale-015
        - 2014-09-26_pale-016
        - 2014-10-01_pale-019
        - 2014-10-19_pale-020
        - 2014-11-25_pale-014
        - 2015-04-13_pale-017
    features:
      normalization_level: deployment
      cluster_length_mode: fixed
      duration_s: 30
      min_samples_per_chunk: 10
      max_chunks_per_deployment: 40000
      max_chunks_total: 1000000
      test_run: false
      test_max_chunks_per_deployment: 1000
      umap_sample_frac: 0.1
      random_state: 42
      strict_qc: false
      channel_feature_spec:
        odba.odba:
          transforms:
          - raw
          feature_set: full
        prh.pitch:
          transforms:
          - raw
          feature_set: medium
        prh.roll:
          transforms:
          - raw
          feature_set: medium
        dynamic_accel.dynX:
          transforms:
          - raw
          feature_set: full
          required: false
        dynamic_accel.dynY:
          transforms:
          - raw
          feature_set: full
          required: false
        stroke_rate.stroke_rate:
          transforms:
          - raw
          feature_set: medium
          required: false
      include_corrected_acc: false
      keep_unified_df: false
      memory_log_interval_s: 30
      enable_catch22: true
      catch22_feature_cols: []
      catch22_max_chunks_per_deployment: null
    unsupervised:
      cluster_passes:
      - name: k2
        n_clusters: 2
        channel_feature_spec:
          odba.odba:
            transforms:
            - raw
            feature_set: full
      - name: k5
        n_clusters: 5
        channel_feature_spec:
          odba.odba:
            transforms:
            - raw
            feature_set: full
          prh.pitch:
            transforms:
            - raw
            feature_set: medium
          prh.roll:
            transforms:
            - raw
            feature_set: medium
          dynamic_accel.dynX:
            transforms:
            - raw
            feature_set: full
            required: false
          dynamic_accel.dynY:
            transforms:
            - raw
            feature_set: full
            required: false
          stroke_rate.stroke_rate:
            transforms:
            - raw
            feature_set: medium
            required: false
      primary_input_channel_for_ranking: odba.odba
      corr_threshold: 0.8
      n_clusters: 5
      max_k: 8
      run_pca: true
      run_tsne: false
      run_umap: false
    supervised:
      enabled: true
      config:
        test_size: 0.4
        rf_n_estimators: 500
        rf_min_samples_leaf: 2
        rf_class_weight: balanced_subsample
        enable_lightgbm: false
        lightgbm_n_estimators: 300
        lightgbm_learning_rate: 0.05
        lightgbm_num_leaves: 31
        enable_svm: false
        svm_kernel: rbf
        svm_c: 1.0
        svm_gamma: scale
        enable_knn: false
        knn_n_neighbors: 25
        knn_weights: distance
        enable_channel_ablation: true
        ablation_mode: grouped_forward_addition
        ablation_feature_groups:
        - label: ODBA Only
          channels:
          - odba.odba
        - label: ODBA + PRH
          channels:
          - odba.odba
          - prh.pitch
          - prh.roll
        - label: ODBA + PRH + Dyn Accel
          channels:
          - odba.odba
          - prh.pitch
          - prh.roll
          - dynamic_accel.dynX
          - dynamic_accel.dynY
        - label: ODBA + PRH + Dyn Accel + Stroke
          channels:
          - odba.odba
          - prh.pitch
          - prh.roll
          - dynamic_accel.dynX
          - dynamic_accel.dynY
          - stroke_rate.stroke_rate
        include_algorithmic_baseline: false
        prediction_scope: all_windows
        confidence_threshold: 0.4
        use_probability_calibration: true
        calibration_method: sigmoid
        calibration_cv: 3
        export_rf_events: true
        label_group: BEHAVIOR_LIONS
    summary:
      config:
        primary_method_kind: algorithmic
        primary_method_id: algorithmic_segments
        budget_label_mode: canonical
        actograms:
          daily: true
          continuous: true
  mian_sleep_rf_test:
    scope:
      analysis_id: mian_sleep_rf_test
      dataset_ids:
      - mian-juv-nese_sleep_lml-ano_JKB
      deployment_ids:
      - 2021-04-04_mian-009
      - 2021-04-17_mian-011
      - 2022-04-01_mian-013
      expected_signals:
      - depth
      - prh
      - velocity
      - stroke_rate
      - label
      groups:
        mian_sleep:
        - 2021-04-04_mian-009
        - 2021-04-17_mian-011
        - 2022-04-01_mian-013
    algorithmic:
      segments:
        enabled: true
        method: depth_drift_thresholds
        method_name: rest
        source_channel: depth.depth
        standardize: true
        quantize_step: 1.0
        base_smooth_seconds: 6
        coarse_smooth_seconds: 12
        coarse_interval_threshold_s: 5
        coarse_resolution_threshold: 1.0
        end_segments_upon_d1_sign_change: true
        filter_out_ascent: true
        filter_out_descent: false
        thresholds:
          drift_rate_abs_max_ms: 0.55
          curvature_abs_max_ms: 0.3
        terminal_criteria:
          unscorable:
            enabled: true
            uses_min_duration: true
            uses_nonzero_mean_d1: true
            uses_zero_mean_d2: true
        label_group: WAKE_v_SLEEP_SEALS
        event_keys:
          initial: rest.initial
          filtered: rest.filtered
        context_filters:
        - use: low_stroke_rate_required
          rule:
            keep_if:
              comparator: <
              threshold: 10.0
        unscorable_interpolated_gap_min_duration_s: 40.0
        unscorable_interpolated_gap_min_abs_mean_d1_ms: 0.0
        unscorable_interpolated_gap_max_abs_mean_d2_ms2: 0.0
        unscorable_interpolated_gap_abs_mean_d2_tolerance_ms2: 1.0e-09
        expected_signals:
        - depth
        - prh
        - velocity
        - stroke_rate
        - label
        channel_feature_spec:
          depth.depth:
            transforms:
            - raw
            - diff
            - diff2
            feature_set: full
          prh.pitch:
            transforms:
            - raw
            feature_set: full
          prh.roll:
            transforms:
            - raw
            feature_set: full
          prh.heading:
            transforms:
            - raw
            feature_set: full
            required: false
          velocity.velocity:
            transforms:
            - raw
            feature_set: full
            required: false
          stroke_rate.stroke_rate:
            transforms:
            - raw
            feature_set: medium
            required: false
        primary_input_channel_for_ranking: depth.depth
        corr_threshold: 0.8
        n_clusters: 5
        max_k: 8
        run_pca: true
        run_tsne: false
        run_umap: true
    features:
      normalization_level: deployment
      cluster_length_mode: fixed
      duration_s: 30
      min_samples_per_chunk: 10
      max_chunks_per_deployment: 40000
      max_chunks_total: 1000000
      test_run: false
      test_max_chunks_per_deployment: 1000
      umap_sample_frac: 0.1
      random_state: 42
      strict_qc: false
      sampling_compatibility_tolerance: 0.05
      channel_feature_spec:
        depth.depth:
          transforms:
          - raw
          - diff
          - diff2
          feature_set: full
        prh.pitch:
          transforms:
          - raw
          feature_set: full
        prh.roll:
          transforms:
          - raw
          feature_set: full
        prh.heading:
          transforms:
          - raw
          feature_set: full
          required: false
        velocity.velocity:
          transforms:
          - raw
          feature_set: full
          required: false
        stroke_rate.stroke_rate:
          transforms:
          - raw
          feature_set: medium
          required: false
    unsupervised:
      primary_input_channel_for_ranking: depth.depth
      corr_threshold: 0.8
      n_clusters: 5
      max_k: 8
      run_pca: true
      run_tsne: false
      run_umap: true
    supervised:
      enabled: true
      config:
        test_size: 0.4
        rf_n_estimators: 500
        rf_min_samples_leaf: 2
        rf_class_weight: balanced_subsample
        enable_lightgbm: false
        lightgbm_n_estimators: 300
        lightgbm_learning_rate: 0.05
        lightgbm_num_leaves: 31
        enable_svm: false
        svm_kernel: rbf
        svm_c: 1.0
        svm_gamma: scale
        enable_knn: false
        knn_n_neighbors: 25
        knn_weights: distance
        enable_channel_ablation: true
        ablation_mode: grouped_forward_addition
        ablation_feature_groups:
        - label: Depth Only
          channels:
          - depth.depth
        - label: Depth + Accel
          channels:
          - depth.depth
          - stroke_rate.stroke_rate
          - prh.pitch
          - prh.roll
        - label: Depth + Accel + Mag
          channels:
          - depth.depth
          - stroke_rate.stroke_rate
          - prh.pitch
          - prh.roll
          - prh.heading
        - label: Depth + Accel + Mag + Speed
          channels:
          - depth.depth
          - stroke_rate.stroke_rate
          - prh.pitch
          - prh.roll
          - prh.heading
          - velocity.velocity
        include_algorithmic_baseline: true
        confidence_threshold: 0.4
        use_probability_calibration: true
        calibration_method: sigmoid
        calibration_cv: 3
        export_rf_events: true
        context_filters:
        - inferred_buoyancy_must-be-aligned
        - gliding_must-be-true
        label_group: WAKE_v_REST_SEALS
    summary:
      config:
        primary_method_kind: algorithmic
        primary_method_id: algorithmic_segments
        budget_label_mode: canonical
        actograms:
          daily: true
          continuous: true
  mian_mile_depth_standardized_30s:
    scope:
      analysis_id: mian_mile_depth_standardized_30s
      dataset_ids:
      - mile-adult-sese_vdr_argentina_RD-KM
      - mian-adult-nese_tdr-sr_TA-AT-YN-DC
      - mian-juv-nese_sleep_lml-ano_JKB
      deployment_ids:
      - 2021-04-04_mian-009
      - 2021-04-17_mian-011
      - 2022-04-01_mian-013
      - 2012-11-02_mile-001
      - 2012-11-02_mile-002
      - 2012-11-01_mile-003
      - 2013-11-10_mile-006
      - 2013-11-09_mile-008
      - 2015-11-05_mile-011
      - 2015-11-05_mile-013
      - 2015-11-06_mile-014
      - 2011-02-21_mian-1001
      - 2011-02-23_mian-1002
      - 2011-02-23_mian-1003
      - 2011-06-09_mian-1005
      - 2011-06-11_mian-1004
      - 2011-06-14_mian-1006
      - 2011-06-22_mian-1002
      - 2012-02-07_mian-1008
      - 2012-02-04_mian-1009
      - 2012-02-06_mian-1010
      - 2012-02-09_mian-1011
      - 2012-02-11_mian-1012
      - 2012-06-04_mian-1013
      - 2012-06-03_mian-1014
      - 2012-05-30_mian-1016
      - 2012-06-05_mian-1015
      expected_signals:
      - depth
      - stroke_rate
    algorithmic:
      segments:
        enabled: true
        method: depth_drift_thresholds
        method_name: find_rest
        source_channel: depth.depth
        standardize: true
        quantize_step: 1.0
        base_smooth_seconds: 6
        coarse_smooth_seconds: 12
        coarse_interval_threshold_s: 5
        coarse_resolution_threshold: 1.0
        end_segments_upon_d1_sign_change: true
        filter_out_ascent: false
        filter_out_descent: false
        thresholds:
          dive_depth_min_m: 2.0
          first_deriv_abs_max_ms: 0.6
          second_deriv_abs_max_ms2: 0.05
          min_duration_s: 180.0
          surface_sleep_min_duration_s: 600.0
          drift_rate_abs_max_ms: 0.3
          curvature_abs_max_ms: 0.1
          end_flat_abs_mean_d1_max_ms: 0.01
          unscorable_interpolated_gap_min_duration_s: 40.0
          unscorable_interpolated_gap_min_abs_mean_d1_ms: 0.0
          unscorable_interpolated_gap_max_abs_mean_d2_ms2: 0.0
          unscorable_interpolated_gap_abs_mean_d2_tolerance_ms2: 1.0e-09
        terminal_criteria:
          unscorable:
            enabled: true
            uses_min_duration: true
            uses_nonzero_mean_d1: true
            uses_zero_mean_d2: true
        label_group: WAKE_v_SLEEP_SEALS
        event_keys:
          initial: find_rest.initial
          filtered: find_rest.filtered
        debug:
          write_context_review_table: true
          persist_context_helper_channels: false
          persist_intermediate_channels: true
        covariates:
          intrinsic:
            inferred_buoyancy:
              enabled: true
              provider: smoothed_segment_metric
              source_metric: drift_rate_ms
              subset_filters:
                min_duration_s: 180.0
                max_start_depth_m: 500.0
                exclude_long_flats: true
              smoothing:
                method: rolling_fraction
                window_fraction_of_trip: 0.05
                min_periods: 1
              phase_thresholds:
                negative_max: -0.03
                positive_min: 0.0
              trip_phase_inference:
                min_positive_elapsed_days: 20.0
                backtrack_days: 20.0
                always_positive_max_day: 20.0
                near_arrival_exclusion_days: 5.0
                early_window_days: 15.0
                late_window_days: 15.0
                reference_max_start_depth_m: 500.0
              outputs:
                segment_value_field: inferred_buoyancy_value
                segment_phase_field: inferred_buoyancy_phase
                segment_positive_likely_day_field: inferred_positive_likely_day
                segment_trip_phase_field: inferred_trip_phase
                segment_early_reference_field: inferred_buoyancy_early_reference_value
                segment_late_reference_field: inferred_buoyancy_late_reference_value
            stroke_rate_rest_gate:
              enabled: true
              provider: segment_channel_stat
              source_channel: stroke_rate.stroke_rate
              agg: mean
              outputs:
                segment_value_field: segment_mean_stroke_rate_spm
                segment_phase_field: segment_stroke_rate_phase
                segment_trip_phase_field: segment_stroke_rate_trip_phase
          extrinsic: {}
        context_filters:
        - low_stroke_rate_required
        - drift_within_intrinsic_context
        - prepositive_negative_only
        - prepositive_negative_long_enough
        - prepositive_negative_not_benthic_transit
        - postpositive_negative_deep_enough
        - postpositive_negative_long_enough
        - early_trip_refinement
        - late_trip_refinement
    features:
      normalization_level: deployment
      cluster_length_mode: variable
      window_s: 30
      stride_s: 10
      min_samples_per_chunk: 5
      max_chunks_per_deployment: 40000
      max_chunks_total: 1000000
      test_run: false
      test_max_chunks_per_deployment: 1000
      umap_sample_frac: 0.1
      random_state: 42
      strict_qc: false
      sampling_compatibility_tolerance: 0.05
      channel_feature_spec:
        standardized_depth.depth_std:
          transforms:
          - raw
          feature_set: full
        standardized_depth.depth_d1_std:
          transforms:
          - raw
          feature_set: full
        standardized_depth.depth_d2_std:
          transforms:
          - raw
          feature_set: full
      preprocessing:
        standardized_channels:
          depth.depth:
            method: adaptive_gaussian_quantized
            quantize_step: 1.0
            base_smooth_seconds: 6
            coarse_smooth_seconds: 12
            coarse_interval_threshold_s: 5
            coarse_resolution_threshold: 1.0
            derivative_orders:
            - 0
            - 1
            - 2
            output_prefix: standardized_depth
    unsupervised:
      cluster_passes:
      - name: k2
        n_clusters: 2
        channel_feature_spec:
          standardized_depth.depth_std:
            transforms:
            - raw
            feature_set: full
      - name: k5
        n_clusters: 5
        channel_feature_spec:
          standardized_depth.depth_d1_std:
            transforms:
            - raw
            feature_set: full
          standardized_depth.depth_d2_std:
            transforms:
            - raw
            feature_set: full
      primary_input_channel_for_ranking: standardized_depth.depth_std
      corr_threshold: 0.8
      n_clusters: auto
      max_k: 8
      run_pca: true
      run_tsne: false
      run_umap: false
    supervised:
      enabled: false
      config:
        test_size: 0.4
        rf_n_estimators: 500
        rf_min_samples_leaf: 2
        rf_class_weight: balanced_subsample
        confidence_threshold: 0.4
