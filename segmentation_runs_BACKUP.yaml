        standardized_depth.depth_d1_std:
          transforms:
          - raw
          feature_set: full
        standardized_depth.depth_d2_std:
          transforms:
          - raw
          feature_set: full
    primary_input_channel_for_ranking: standardized_depth.depth_std
    corr_threshold: 0.8
    n_clusters: auto
    max_k: 8
    run_pca: true
    run_tsne: false
    run_umap: false
    enable_supervised: false
    supervised:
      test_size: 0.4
      rf_n_estimators: 500
      rf_min_samples_leaf: 2
      rf_class_weight: balanced_subsample
      confidence_threshold: 0.4
      label_event_keys: []
  
